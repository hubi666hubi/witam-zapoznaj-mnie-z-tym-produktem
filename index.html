<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In &bull; Logowanie</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mesh-bg {
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.25) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
    }
  </style>
</head>
<body class="mesh-bg min-h-screen text-slate-100 flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full px-6 py-6 max-w-7xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
        Antigravity App
      </span>
    </div>
    
    <div class="text-sm text-slate-400">
      Potrzebujesz pomocy? <a href="#" class="text-indigo-400 hover:text-indigo-300 transition-colors underline underline-offset-4">Kontakt</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md mx-auto px-4 py-8">
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 shadow-2xl shadow-black/50">
      
      <!-- Tabs -->
      <div class="flex p-1 mb-8 bg-slate-800/60 rounded-2xl border border-slate-700/50">
        <button id="tab-signin" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
          Zaloguj się
        </button>
        <button id="tab-signup" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200">
          Zarejestruj się
        </button>
      </div>

      <!-- Title & Subtitle -->
      <div class="text-center mb-6">
        <h1 id="form-title" class="text-2xl font-bold text-white tracking-tight">Witaj ponownie</h1>
        <p id="form-subtitle" class="text-sm text-slate-400 mt-1.5">Wprowadź swoje dane, aby uzyskać dostęp do konta</p>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <button type="button" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800/40 hover:bg-slate-800 hover:border-slate-600 transition-all text-sm font-medium text-slate-200">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google
        </button>
        <button type="button" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800/40 hover:bg-slate-800 hover:border-slate-600 transition-all text-sm font-medium text-slate-200">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          GitHub
        </button>
      </div>

      <!-- Divider -->
      <div class="relative flex items-center justify-center mb-6">
        <div class="border-t border-slate-800 w-full"></div>
        <span class="bg-slate-900 px-3 text-xs text-slate-500 uppercase tracking-wider">lub przez e-mail</span>
        <div class="border-t border-slate-800 w-full"></div>
      </div>

      <!-- Form -->
      <form id="auth-form" class="space-y-4">
        <!-- Name field (hidden in login mode) -->
        <div id="field-name" class="hidden">
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Imię i nazwisko</label>
          <div class="relative">
            <input type="text" id="input-name" placeholder="Jan Kowalski" 
                   class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" />
          </div>
        </div>

        <!-- Email field -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Adres e-mail</label>
          <div class="relative">
            <input type="email" id="input-email" required placeholder="twoj@email.com" 
                   class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" />
          </div>
        </div>

        <!-- Password field -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Hasło</label>
            <a href="#" id="link-forgot" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">Nie pamiętasz hasła?</a>
          </div>
          <div class="relative">
            <input type="password" id="input-password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" 
                   class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl pl-4 pr-11 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" />
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition-colors">
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Checkbox / Remember me -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900" />
            <span class="text-xs text-slate-300">Zapamiętaj mnie</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" 
                class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600 hover:from-indigo-400 hover:via-indigo-500 hover:to-purple-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
          <span id="btn-text">Zaloguj się</span>
          <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <!-- Toast Feedback Message -->
      <div id="toast-message" class="hidden mt-4 p-3 rounded-xl text-xs font-medium border text-center transition-all"></div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full px-6 py-6 text-center text-xs text-slate-500">
    &copy; 2026 Antigravity Workspace &bull; Bezpieczne logowanie z szyfrowaniem TLS
  </footer>

  <!-- Interactive JavaScript -->
  <script>
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const fieldName = document.getElementById('field-name');
    const inputName = document.getElementById('input-name');
    const linkForgot = document.getElementById('link-forgot');
    const btnText = document.getElementById('btn-text');
    const authForm = document.getElementById('auth-form');
    const togglePassword = document.getElementById('toggle-password');
    const inputPassword = document.getElementById('input-password');
    const btnSpinner = document.getElementById('btn-spinner');
    const toastMessage = document.getElementById('toast-message');

    let currentMode = 'signin';

    function setMode(mode) {
      currentMode = mode;
      toastMessage.classList.add('hidden');
      if (mode === 'signin') {
        tabSignIn.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
        tabSignUp.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200';
        formTitle.textContent = 'Witaj ponownie';
        formSubtitle.textContent = 'Wprowadź swoje dane, aby uzyskać dostęp do konta';
        fieldName.classList.add('hidden');
        inputName.removeAttribute('required');
        linkForgot.classList.remove('hidden');
        btnText.textContent = 'Zaloguj się';
      } else {
        tabSignUp.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
        tabSignIn.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200';
        formTitle.textContent = 'Utwórz nowe konto';
        formSubtitle.textContent = 'Zacznij korzystać z platformy w kilka sekund';
        fieldName.classList.remove('hidden');
        inputName.setAttribute('required', 'true');
        linkForgot.classList.add('hidden');
        btnText.textContent = 'Zarejestruj się';
      }
    }

    tabSignIn.addEventListener('click', () => setMode('signin'));
    tabSignUp.addEventListener('click', () => setMode('signup'));

    // Toggle Password Visibility
    let showPassword = false;
    togglePassword.addEventListener('click', () => {
      showPassword = !showPassword;
      inputPassword.type = showPassword ? 'text' : 'password';
      togglePassword.classList.toggle('text-indigo-400', showPassword);
      togglePassword.classList.toggle('text-slate-400', !showPassword);
    });

    // Form submission simulation
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      btnSpinner.classList.remove('hidden');
      btnText.textContent = currentMode === 'signin' ? 'Logowanie...' : 'Tworzenie konta...';

      setTimeout(() => {
        btnSpinner.classList.add('hidden');
        btnText.textContent = currentMode === 'signin' ? 'Zaloguj się' : 'Zarejestruj się';
        
        toastMessage.className = 'mt-4 p-3 rounded-xl text-xs font-medium border text-center transition-all bg-emerald-950/70 text-emerald-300 border-emerald-700/60';
        toastMessage.textContent = currentMode === 'signin' 
          ? 'Sukces! Zalogowano pomyślnie. Witamy w panelu.' 
          : 'Konto zostało utworzone! Sprawdź pocztę e-mail, aby je aktywować.';
        toastMessage.classList.remove('hidden');
      }, 1000);
    });
  </script>
</body>
</html>
